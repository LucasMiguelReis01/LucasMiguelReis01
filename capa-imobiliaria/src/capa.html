<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Reis Imóveis — Capa</title>
<style>
  @font-face { font-family: "Italiana"; src: url("fonts/Italiana-Regular.ttf"); }
  @font-face { font-family: "InstrumentSerif"; src: url("fonts/InstrumentSerif-Italic.ttf"); font-style: italic; }
  @font-face { font-family: "Jura"; src: url("fonts/Jura-Light.ttf"); font-weight: 300; }
  @font-face { font-family: "Jura"; src: url("fonts/Jura-Medium.ttf"); font-weight: 500; }
  html, body { margin: 0; padding: 0; background: #F1ECE2; }
  svg { display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const params = new URLSearchParams(location.search);
const variant = params.get("v") || "retrato";

// Paleta
const DARK = params.get("t") === "escuro";
const PAPER = DARK ? "#16231E" : "#F1ECE2";   // verde-floresta profundo | marfim
const INK   = DARK ? "#DCC9A0" : "#1E2B26";   // champanhe | verde quase negro
const BRASS = DARK ? "#C59A55" : "#A6824E";   // ouro velho | latão envelhecido
const VIG   = DARK ? "#0A120F" : "#D9D0BF";
const GRAIN = DARK ? "0 0 0 0 0.92  0 0 0 0 0.86  0 0 0 0 0.72  0 0 0 0.07 0"
                   : "0 0 0 0 0.12  0 0 0 0 0.14  0 0 0 0 0.12  0 0 0 0.09 0";
document.documentElement.style.background = PAPER;

const NAME    = "REIS";
const SUB     = "NEGÓCIOS IMOBILIÁRIOS";
const TAGLINE = "Confiança em cada endereço.";
const NAME2   = "IMÓVEIS";

const ns = "http://www.w3.org/2000/svg";
const f = n => +n.toFixed(2);

function archPath(cx, by, w, h) {
  const r = w / 2, sy = by - h + r;
  return `M${f(cx-r)},${f(by)} L${f(cx-r)},${f(sy)} A${f(r)},${f(r)} 0 0 1 ${f(cx+r)},${f(sy)} L${f(cx+r)},${f(by)}`;
}

// O limiar: arcos aninhados convergindo para o centro da soleira
function threshold(cx, by, w, h, opts = {}) {
  const n = opts.n || 44, ratio = opts.ratio || 0.935;
  let out = "";
  for (let i = 0; i < n; i++) {
    const s = Math.pow(ratio, i);
    const t = i / (n - 1);
    const op = 0.92 - 0.62 * t;
    const sw = i === 0 ? 1.4 : 0.75;
    out += `<path d="${archPath(cx, by, w * s, h * s)}" fill="none" stroke="${INK}" stroke-width="${sw}" stroke-opacity="${f(op)}"/>`;
  }
  // Moldura externa dupla (batente)
  const g = opts.gap || 14;
  out += `<path d="${archPath(cx, by, w + 2*g, h + g)}" fill="none" stroke="${INK}" stroke-width="0.7" stroke-opacity="0.55"/>`;

  // Pedra angular (keystone) — o que sustenta o arco
  const ky = by - h - g / 2, kt = opts.k || 1;
  const kw1 = 30*kt, kw2 = 18*kt, kh = 40*kt;
  const top = ky - kh*0.42, bot = ky + kh*0.58;
  out += `<path d="M${f(cx-kw1/2)},${f(top)} L${f(cx+kw1/2)},${f(top)} L${f(cx+kw2/2)},${f(bot)} L${f(cx-kw2/2)},${f(bot)} Z"
           fill="${PAPER}" stroke="${BRASS}" stroke-width="1.1"/>`;
  out += `<path d="M${f(cx-kw1/2+5*kt)},${f(top+5*kt)} L${f(cx+kw1/2-5*kt)},${f(top+5*kt)} L${f(cx+kw2/2-3*kt)},${f(bot-5*kt)} L${f(cx-kw2/2+3*kt)},${f(bot-5*kt)} Z"
           fill="${BRASS}" fill-opacity="0.85"/>`;

  // Soleira: linha de base com régua
  const half = opts.base || w * 0.95;
  out += `<line x1="${f(cx-half)}" y1="${by}" x2="${f(cx+half)}" y2="${by}" stroke="${INK}" stroke-width="0.9" stroke-opacity="0.8"/>`;
  const step = opts.tick || 12;
  for (let x = -half; x <= half + 0.01; x += step) {
    const k = Math.round(x / step);
    const len = k % 10 === 0 ? 9 : (k % 5 === 0 ? 6 : 3);
    out += `<line x1="${f(cx+x)}" y1="${by+3}" x2="${f(cx+x)}" y2="${by+3+len}" stroke="${INK}" stroke-width="0.6" stroke-opacity="0.5"/>`;
  }
  // Ponto de chegada
  out += `<circle cx="${cx}" cy="${by}" r="${3.2*kt}" fill="${BRASS}"/>`;
  return out;
}

function cross(x, y, s = 7) {
  return `<g stroke="${INK}" stroke-width="0.6" stroke-opacity="0.55">
    <line x1="${x-s}" y1="${y}" x2="${x+s}" y2="${y}"/><line x1="${x}" y1="${y-s}" x2="${x}" y2="${y+s}"/></g>
    <circle cx="${x}" cy="${y}" r="${s*0.45}" fill="none" stroke="${INK}" stroke-width="0.5" stroke-opacity="0.5"/>`;
}

function label(x, y, t, size, anchor = "middle", spacing = "0.42em", color = INK, op = 0.75, weight = 300) {
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="Jura" font-weight="${weight}" font-size="${size}"
    letter-spacing="${spacing}" fill="${color}" fill-opacity="${op}">${t}</text>`;
}

const grain = `
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="${GRAIN}"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%">
    <stop offset="60%" stop-color="${PAPER}" stop-opacity="0"/>
    <stop offset="100%" stop-color="${VIG}" stop-opacity="${DARK ? 0.7 : 0.55}"/>
  </radialGradient>`;

// Espaçamento tipográfico: compensa o tracking final no centro
function wordmark(cx, y, size, spacingEm) {
  const shift = size * spacingEm / 2;
  return `<text x="${f(cx + shift)}" y="${y}" text-anchor="middle" font-family="Italiana" font-size="${size}"
    letter-spacing="${spacingEm}em" fill="${INK}">${NAME}</text>`;
}
function serifCaps(cx, y, t, size, spacingEm) {
  const shift = size * spacingEm / 2;
  return `<text x="${f(cx + shift)}" y="${y}" text-anchor="middle" font-family="Italiana" font-size="${size}"
    letter-spacing="${spacingEm}em" fill="${INK}" fill-opacity="0.92">${t}</text>`;
}
function centered(cx, y, t, size, spacingEm, extra = "") {
  const shift = size * spacingEm / 2;
  return `<text x="${f(cx + shift)}" y="${y}" text-anchor="middle" font-family="Jura" font-weight="300" font-size="${size}"
    letter-spacing="${spacingEm}em" fill="${INK}" ${extra}>${t}</text>`;
}

function retrato() {
  const W = 1240, H = 1754, cx = W / 2, M = 92;
  let s = `<svg xmlns="${ns}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs>${grain}</defs>
    <rect width="${W}" height="${H}" fill="${PAPER}"/><rect width="${W}" height="${H}" fill="url(#vig)"/>`;

  // Moldura de página — fio fino
  s += `<rect x="${M}" y="${M}" width="${W-2*M}" height="${H-2*M}" fill="none" stroke="${INK}" stroke-width="0.6" stroke-opacity="0.35"/>`;
  [[M, M], [W-M, M], [M, H-M], [W-M, H-M]].forEach(([x, y]) => s += cross(x, y, 9));

  // Cabeçalho
  s += label(M + 38, M + 58, "Nº 01", 13, "start", "0.38em");
  s += label(W - M - 38, M + 58, "MMXXVI", 13, "end", "0.38em");
  s += `<path d="M${cx},${M+48} l5,5 l-5,5 l-5,-5 Z" fill="${BRASS}"/>`;

  // O limiar
  const by = 1046, w = 520, h = 700;
  s += threshold(cx, by, w, h, { n: 46, ratio: 0.936, gap: 16, base: 330, tick: 11, k: 1.05 });

  // Cotas laterais (medida da passagem)
  const lx = cx - w/2 - 64, top = by - h;
  s += `<g stroke="${INK}" stroke-opacity="0.4" stroke-width="0.6">
    <line x1="${lx}" y1="${top}" x2="${lx}" y2="${by}"/>
    <line x1="${lx-5}" y1="${top}" x2="${lx+5}" y2="${top}"/><line x1="${lx-5}" y1="${by}" x2="${lx+5}" y2="${by}"/></g>`;
  s += `<text transform="translate(${lx-12},${(top+by)/2}) rotate(-90)" text-anchor="middle" font-family="Jura" font-weight="300"
          font-size="11" letter-spacing="0.4em" fill="${INK}" fill-opacity="0.55">LIMIAR · 1 : 1</text>`;
  const rx = cx + w/2 + 64;
  s += `<g stroke="${INK}" stroke-opacity="0.4" stroke-width="0.6">
    <line x1="${rx}" y1="${top}" x2="${rx}" y2="${by}"/>
    <line x1="${rx-5}" y1="${top}" x2="${rx+5}" y2="${top}"/><line x1="${rx-5}" y1="${by}" x2="${rx+5}" y2="${by}"/></g>`;
  s += `<text transform="translate(${rx+20},${(top+by)/2}) rotate(90)" text-anchor="middle" font-family="Jura" font-weight="300"
          font-size="11" letter-spacing="0.4em" fill="${INK}" fill-opacity="0.55">PEDRA ANGULAR</text>`;

  // Marca
  s += wordmark(cx, 1236, 150, 0.30);
  s += serifCaps(cx, 1312, NAME2, 46, 0.52);
  s += `<line x1="${cx-150}" y1="1362" x2="${cx-40}" y2="1362" stroke="${BRASS}" stroke-width="0.9"/>`;
  s += `<line x1="${cx+40}" y1="1362" x2="${cx+150}" y2="1362" stroke="${BRASS}" stroke-width="0.9"/>`;
  s += `<path d="M${cx},1357 l5,5 l-5,5 l-5,-5 Z" fill="none" stroke="${BRASS}" stroke-width="0.9"/>`;
  s += centered(cx, 1416, SUB, 16, 0.62, `fill-opacity="0.85"`);

  // Frase
  s += `<text x="${cx}" y="1520" text-anchor="middle" font-family="InstrumentSerif" font-style="italic" font-size="32"
          fill="${INK}" fill-opacity="0.82">${TAGLINE}</text>`;

  s += `<rect width="${W}" height="${H}" filter="url(#grain)"/></svg>`;
  return s;
}

function banner() {
  const W = 1640, H = 624, M = 34;
  let s = `<svg xmlns="${ns}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs>${grain}</defs>
    <rect width="${W}" height="${H}" fill="${PAPER}"/><rect width="${W}" height="${H}" fill="url(#vig)"/>`;
  s += `<rect x="${M}" y="${M}" width="${W-2*M}" height="${H-2*M}" fill="none" stroke="${INK}" stroke-width="0.6" stroke-opacity="0.32"/>`;
  [[M, M], [W-M, M], [M, H-M], [W-M, H-M]].forEach(([x, y]) => s += cross(x, y, 7));

  // Limiar à direita, texto à esquerda-centro (deixa livre o canto da foto de perfil)
  const acx = 1250, by = 512, w = 270, h = 384;
  s += threshold(acx, by, w, h, { n: 40, ratio: 0.928, gap: 11, base: 210, tick: 9, k: 0.8 });

  const tx = 720;
  s += wordmark(tx, 262, 112, 0.30);
  s += serifCaps(tx, 320, NAME2, 34, 0.52);
  s += `<line x1="${tx-120}" y1="358" x2="${tx-32}" y2="358" stroke="${BRASS}" stroke-width="0.9"/>`;
  s += `<line x1="${tx+32}" y1="358" x2="${tx+120}" y2="358" stroke="${BRASS}" stroke-width="0.9"/>`;
  s += `<path d="M${tx},353 l5,5 l-5,5 l-5,-5 Z" fill="none" stroke="${BRASS}" stroke-width="0.9"/>`;
  s += centered(tx, 400, SUB, 13, 0.62, `fill-opacity="0.85"`);
  s += `<text x="${tx}" y="466" text-anchor="middle" font-family="InstrumentSerif" font-style="italic" font-size="26"
          fill="${INK}" fill-opacity="0.82">${TAGLINE}</text>`;

  s += label(M + 34, M + 44, "Nº 01", 11, "start", "0.38em");
  s += label(W - M - 34, M + 44, "MMXXVI", 11, "end", "0.38em");
  s += `<rect width="${W}" height="${H}" filter="url(#grain)"/></svg>`;
  return s;
}

document.getElementById("root").innerHTML = variant === "banner" ? banner() : retrato();
document.fonts.ready.then(() => document.body.setAttribute("data-ready", "1"));
</script>
</body>
</html>
