<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Anúncio 1 Oferta</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700;800;900&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#0a1a35;font-family:Montserrat,sans-serif;color:#fff;position:relative}
.photo{position:absolute;left:0;right:0;top:0;height:820px;background:url(../assets/vista.jpg) 45% 30%/auto 900px;filter:saturate(1.3) brightness(1.12) contrast(1.05)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,26,53,.55) 0%,rgba(10,26,53,.05) 22%,rgba(10,26,53,.15) 40%,rgba(10,26,53,.9) 56%,#0a1a35 64%)}
.top{position:absolute;left:56px;right:56px;top:48px;display:flex;justify-content:space-between;align-items:center}
.logo{width:250px;border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.tag{display:inline-flex;align-items:center;gap:12px;padding:14px 28px;border-radius:999px;background:#ff3b30;font-weight:900;font-size:28px;letter-spacing:.08em}
.anton{font-family:Anton,sans-serif;text-transform:uppercase;line-height:.95}
.main{position:absolute;left:56px;right:56px;top:500px}
.k{font-family:Anton;font-size:74px;text-transform:uppercase;text-shadow:0 6px 24px rgba(0,0,0,.6)}
.big{font-family:Anton;font-size:250px;line-height:.92;color:#ffd23f;text-shadow:0 10px 40px rgba(0,0,0,.5)}
.sub{margin-top:18px;font-size:44px;font-weight:800;line-height:1.2}
.sub span{color:#ffd23f}
.checks{position:absolute;left:56px;right:56px;top:1000px;display:flex;gap:16px}
.ck{flex:1;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);border-radius:22px;padding:18px 18px}
.ck i{flex:none;width:46px;height:46px;border-radius:50%;background:#25d366;display:grid;place-items:center}
.ck b{font-size:27px;font-weight:800;line-height:1.15}
.cta{position:absolute;left:56px;right:56px;bottom:48px;height:132px;border-radius:30px;background:#25d366;display:flex;align-items:center;gap:24px;padding:0 34px;box-shadow:0 18px 50px rgba(37,211,102,.35)}
.cta .t{font-size:26px;font-weight:900;letter-spacing:.14em}
.cta .n{font-family:Anton;font-size:76px;line-height:1}
.cta .brand{margin-left:auto;display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;letter-spacing:.12em;text-align:right}
.cta .brand img{width:70px;height:70px;border-radius:50%;border:3px solid #fff}
</style></head><body>
<div class="photo"></div><div class="shade"></div>
<div class="top">
  <img class="logo" src="../assets/logo-titulo.jpg">
  <div class="tag"><svg width="34" height="34" viewBox="0 0 24 24"><path fill="#fff" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>SANTO ÂNGELO · MOGI</div>
</div>
<div class="main">
  <div class="k">Seu lote com entrada de</div>
  <div class="big">R$ 20 MIL</div>
  <div class="sub">Restante <span>parcelado direto<br>com o proprietário</span></div>
</div>
<div class="checks">
  <div class="ck"><i><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><b>Sem consulta<br>ao Serasa</b></div>
  <div class="ck"><i><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><b>Sem banco<br>e sem burocracia</b></div>
  <div class="ck"><i><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><b>Lotes a partir<br>de R$ 75 mil</b></div>
</div>
<div class="cta">
  <svg width="84" height="84" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#fff"/><path fill="#25d366" d="M16.9 14.1c-.3-.1-1.6-.8-1.8-.9-.2-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.6.1-.3-.1-1.1-.4-2.1-1.3-.8-.7-1.3-1.5-1.4-1.8-.2-.3 0-.4.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.8-2c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.7c.1.2 1.9 2.9 4.6 4.1 2.3.9 2.7.7 3.2.7.5-.1 1.6-.7 1.8-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z"/></svg>
  <div><div class="t">CHAMA NO WHATSAPP</div><div class="n">(11) 93700-4295</div></div>
  <div class="brand"><img src="../assets/leao.png"></div>
</div>
</body></html>
